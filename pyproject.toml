[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyshuffle"
version = "0.0.2"
authors = [
  { name="Nikolas Tapia", email="tapia@wias-berlin.de" },
]
description = "A simple python implementation of shuffle and concatenation algebras"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["shuffle", "concatenation", "algebra"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/ntapiam/pyshuffle.git"

[tool.pytest.ini_options]
pythonpath = "src"
addopts = ["--import-mode=importlib"]
